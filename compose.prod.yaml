# Server stack: production Next.js + self-hosted Supabase + Caddy (HTTPS).
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Caddy gets Let's Encrypt certificates for SITE_DOMAIN and API_DOMAIN from .env.
# Only ports 80 and 443 are open to the outside. The database and the
# Supabase gateway listen on 127.0.0.1 only. See README.md, "Deploying".

name: groene-weide

include:
  - path:
      - infra/supabase/docker-compose.yml
      - infra/supabase.override.yml
      - infra/supabase.prod.yml
    env_file: .env

services:
  # Applies supabase/migrations and supabase/seed, then exits. The website
  # waits for it, so the schema is always up to date before the site starts.
  migrate:
    image: supabase/postgres:17.6.1.136
    entrypoint: ["sh", "/scripts/migrate.sh"]
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase:/supabase:ro
      - ./scripts/db:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: "no"

  web:
    image: groene-weide-web:prod
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        SITE_URL: ${SITE_URL}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      SUPABASE_URL: http://api-gw:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}
      JOBS_SECRET: ${JOBS_SECRET}
      MANAGE_LINK_SECRET: ${MANAGE_LINK_SECRET}
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}

  # Calls the website's jobs endpoint every 15 minutes: mail retries,
  # reminders and farewell mails. Each job is safe to run twice.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sleep 60; while true; do
        curl -fsS -X POST -H "Authorization: Bearer $$JOBS_SECRET" http://web:3000/api/jobs || true;
        echo; sleep 900; done
    environment:
      JOBS_SECRET: ${JOBS_SECRET}
    depends_on:
      - web

  # Nightly database dump plus the uploaded photos, 14 days kept in
  # ./backups. Copy that folder off the server as well (docs/handover.md).
  backup:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do sh /scripts/backup.sh || echo "backup failed";
        sleep 86400; done
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/db:/scripts:ro
      - ./backups:/backups
      - ./infra/supabase/volumes/storage:/storage:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api-gw

volumes:
  caddy-data:
  caddy-config:

networks:
  npm_shared:
    external: true
