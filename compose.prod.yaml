# Server stack: production Next.js + self-hosted Supabase, behind a reverse
# proxy (Nginx Proxy Manager, or the built-in Caddy with --profile caddy).
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Nothing is mounted from the repository: files the containers need are
# copied into images at build time, so the stack also runs from Portainer
# (which can't mount files from its Git checkout). The database and the
# Supabase gateway listen on 127.0.0.1 only. See README.md, "Deploying".

name: groene-weide

# Migrations and database scripts, for the migrate and backup services.
x-db-tools-build: &db-tools-build
  context: .
  dockerfile_inline: |
    FROM supabase/postgres:17.6.1.136
    COPY supabase /supabase
    COPY scripts/db /scripts

# The included Supabase files read the same variables as this file: from
# .env next to it, or from the stack variables in Portainer (which has no
# .env file, so don't name one here).
include:
  - path:
      - infra/supabase/docker-compose.yml
      - infra/supabase.override.yml
      - infra/supabase.prod.yml

services:
  # Applies supabase/migrations and supabase/seed, then exits. The website
  # waits for it, so the schema is always up to date before the site starts.
  migrate:
    image: groene-weide-db-tools:prod
    build: *db-tools-build
    entrypoint: ["sh", "/scripts/migrate.sh"]
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: "no"

  web:
    image: groene-weide-web:prod
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        SITE_URL: ${SITE_URL}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    # npm_shared: Nginx Proxy Manager forwards SITE_DOMAIN to groene-weide-web:3000.
    networks:
      default:
      npm_shared:
        aliases:
          - groene-weide-web
    environment:
      SUPABASE_URL: http://api-gw:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}
      JOBS_SECRET: ${JOBS_SECRET}
      MANAGE_LINK_SECRET: ${MANAGE_LINK_SECRET}
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}

  # Calls the website's jobs endpoint every 15 minutes: mail retries,
  # reminders and farewell mails. Each job is safe to run twice.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sleep 60; while true; do
        curl -fsS -X POST -H "Authorization: Bearer $$JOBS_SECRET" http://web:3000/api/jobs || true;
        echo; sleep 900; done
    environment:
      JOBS_SECRET: ${JOBS_SECRET}
    depends_on:
      - web

  # Nightly database dump plus the uploaded photos, 14 days kept in the
  # `backups` volume. Copy them off the server as well (docs/handover.md).
  backup:
    image: groene-weide-db-tools:prod
    build: *db-tools-build
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do sh /scripts/backup.sh || echo "backup failed";
        sleep 86400; done
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
      # The photos as Storage keeps them (infra/supabase.override.yml).
      - storage-data:/storage:ro
    depends_on:
      db:
        condition: service_healthy

  # HTTPS for a server without a reverse proxy of its own. Off by default:
  # this server uses Nginx Proxy Manager (npm_shared), which already holds
  # ports 80 and 443. Turn it on with --profile caddy (see README).
  caddy:
    image: groene-weide-caddy:prod
    build:
      context: ./infra/caddy
      dockerfile_inline: |
        FROM caddy:2.11-alpine
        COPY Caddyfile /etc/caddy/Caddyfile
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api-gw

volumes:
  backups:
  caddy-data:
  caddy-config:

networks:
  npm_shared:
    external: true
