# Development stack: Next.js with live reload + self-hosted Supabase + a mail catcher.
#
#   docker compose up --watch
#
# Site:          http://localhost:3000
# Supabase API:  http://localhost:8000  (Studio dashboard on the same URL, login from .env)
# Mail catcher:  http://localhost:8025
#
# Code changes are synced into the container by Compose Watch, and Next.js
# Fast Refresh shows them right away. Changing package.json rebuilds the image.

name: groene-weide

include:
  - path:
      - infra/supabase/docker-compose.yml
      - infra/supabase.override.yml
    env_file: .env

services:
  # Applies supabase/migrations and supabase/seed, then exits. The website
  # waits for it, so the schema is always up to date before the site starts.
  migrate:
    image: supabase/postgres:17.6.1.136
    entrypoint: ["sh", "/scripts/migrate.sh"]
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase:/supabase:ro
      - ./scripts/db:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: "no"

  web:
    image: groene-weide-web:dev
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Server-side calls go over the internal Docker network.
      SUPABASE_URL: http://api-gw:8000
      # The browser talks to Supabase through the published port.
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      # Server only: used for jobs (reminders, retention) and staff invites.
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}
      JOBS_SECRET: ${JOBS_SECRET}
      MANAGE_LINK_SECRET: ${MANAGE_LINK_SECRET}
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
      # All mail goes to Mailpit (http://localhost:8025), whatever the address.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-bert@degroeneweide.example}
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - infra/
            - docs/
            - supabase/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: sync+restart
          path: next.config.ts
          target: /app/next.config.ts

  # Calls the website's jobs endpoint every 15 minutes: mail retries,
  # reminders and farewell mails. Each job is safe to run twice.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sleep 60; while true; do
        curl -fsS -X POST -H "Authorization: Bearer $$JOBS_SECRET" http://web:3000/api/jobs || true;
        echo; sleep 900; done
    environment:
      JOBS_SECRET: ${JOBS_SECRET}
    depends_on:
      - web

  # End-to-end tests (Playwright + axe) against the running stack:
  #   docker compose --profile test run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /work
    # Installs the packages into its own volume (Linux binaries never land in
    # the host folder) and only reinstalls when package-lock.json changed.
    # Extra arguments go to Playwright: ... run --rm e2e e2e/booking.spec.ts
    entrypoint:
      - sh
      - -c
      - >-
        cmp -s package-lock.json node_modules/.e2e-lock ||
        { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.e2e-lock; } &&
        npx playwright test "$$@"
      - e2e
    command: []
    environment:
      BASE_URL: http://web:3000
      MAILPIT_URL: http://mailpit:8025
      # The admin tests create and remove their own staff accounts.
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # The jobs test calls /api/jobs like the cron service does.
      JOBS_SECRET: ${JOBS_SECRET}
      CI: "1"
    volumes:
      - .:/work
      - e2e-node-modules:/work/node_modules
    depends_on:
      - web
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  e2e-node-modules:
