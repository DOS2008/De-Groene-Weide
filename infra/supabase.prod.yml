# Server-only changes on top of the official Supabase compose file.

services:
  # The reverse proxy (Nginx Proxy Manager on npm_shared, or Caddy) is the
  # only way in from outside: it forwards API_DOMAIN to groene-weide-api:8000.
  # The gateway also stays reachable on 127.0.0.1 for an SSH tunnel to the
  # Studio dashboard.
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT}:8000"
    networks:
      default:
      npm_shared:
        aliases:
          - groene-weide-api

networks:
  npm_shared:
    external: true
