<?xml version="1.0" encoding="UTF-8"?>
<!--
  Drawing of the terrain of De Groene Weide (draft, to be redrawn by the team).
  1 unit = 0.25 m (data-metres-per-unit below).

  Every plot is a shape with id="plot-<code>", every facility one with
  id="facility-<key>". scripts/import-map.ts reads the centre of each shape
  and writes the map positions and distances to supabase/seed/03_map.sql.
  Distances are never entered by hand: change this drawing and run
  npm run import-map.
-->
